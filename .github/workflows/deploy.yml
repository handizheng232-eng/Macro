name: Deploy macro dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci
          npm ci --prefix comments-worker
          python -m pip install -r scripts/requirements-data-tests.txt
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --testTimeout=12000 --maxWorkers=1
      - name: Test isolated comments backend (no secrets)
        run: npm test --prefix comments-worker
      - name: Build
        env:
          VITE_CUSTOM_COMMENTS_ENABLED: "true"
          VITE_COMMENTS_API: https://macro-replay-comments.handizheng232.workers.dev
        run: npm run build
      - name: Verify scoped comments and entire inherited publication chain
        run: |
          python -B -m unittest discover -s scripts -p 'test_verify_comments_publish.py' -v
          python -B scripts/verify_comments_publish.py --legacy-tests --dist dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
