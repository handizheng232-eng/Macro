name: Deploy macro dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --testTimeout=12000 --maxWorkers=1
      - name: Build
        run: npm run build
      - name: Verify replay publication gate
        run: |
          node --test scripts/test_verify_replay_publish.mjs
          node scripts/verify_replay_publish.mjs --public-receipt release/replay-publication.json
      - name: Verify approved renewed-easing replay publication
        run: |
          python -B -m unittest discover -s scripts -p 'test_verify_renewed_easing_publish.py' -v
          python -B scripts/verify_renewed_easing_publish.py --dataset release/snapshots/renewed-easing-publication-1.json --receipt release/replay-renewed-easing-publication.json
          python -B -m unittest discover -s scripts -p 'test_verify_renewed_limited_publish.py' -v
          python -B -m unittest discover -s scripts -p 'test_verify_replay_reading_publish.py' -v
          python -B -m unittest discover -s scripts -p 'test_verify_economic_mechanisms_publish.py' -v
          python -B scripts/verify_economic_mechanisms_publish.py --dist dist
      - name: Verify explicitly authorized partial tariff-pause release
        run: python -B scripts/verify_tariff_partial_publish.py --self-test --dist dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
